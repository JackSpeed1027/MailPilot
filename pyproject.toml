[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailpilot"
version = "0.7.0"
description = "个人多邮箱中文摘要与 WxPusher 通知"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mailpilot = "mailpilot.__main__:main"

[tool.setuptools.packages.find]
include = ["mailpilot*"]
